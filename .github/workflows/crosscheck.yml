name: Daily data cross-check
on:
  schedule: [{ cron: "30 0 * * *" }] # 06:00 IST
  workflow_dispatch:
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run crosscheck
